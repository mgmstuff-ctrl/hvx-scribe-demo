<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HVX Scribe Agent Flow</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#0F172A;--surface:#FFFFFF;--bg:#F8FAFC;--primary:#0E7490;--cyan:#0891B2;--success:#10B981;--warning:#F59E0B;--danger:#EF4444;--line:#E2E8F0}*{box-sizing:border-box}body{margin:0;font:14px 'IBM Plex Sans',sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:220px;background:var(--ink);color:white;padding:24px 14px;flex-shrink:0}.brand{font:700 18px Sora;margin-bottom:42px;padding-left:10px}.brand small{display:block;color:#94a3b8;font:12px 'IBM Plex Sans';margin-top:5px}.nav{width:100%;padding:13px;text-align:left;border:0;border-radius:12px;background:transparent;color:#94a3b8;margin-bottom:5px}.nav.active{background:#164e63;color:white}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.top h2{font:600 18px Sora;margin:0}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 16px;color:var(--ink);font-weight:600}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.btn.ghost{border-color:transparent;background:transparent}.btn.danger{color:var(--danger);border-color:#fecaca}.btn:hover{filter:brightness(.96)}.field{border:1px solid #cbd5e1;border-radius:12px;padding:11px;width:100%;background:white;min-width:0}.field:focus{outline:2px solid #67e8f9}.field:disabled{background:#f1f5f9;color:#64748b}.label{display:block;font-weight:600;font-size:12px;margin-bottom:8px}.content{padding:32px}.heading{font:700 25px Sora;margin:0 0 8px}.muted{color:#64748b}.card{border:1px solid var(--line);border-radius:16px;background:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:25px 0}.stat{padding:20px}.stat strong{display:block;font:700 28px Sora;margin-top:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:18px 22px;border-bottom:1px solid #edf2f7}.table th{font-size:12px;letter-spacing:.5px;text-transform:uppercase;background:#f8fafc;color:#64748b}.table tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:30px;padding:5px 10px;font-size:12px;font-weight:600}.pill.Draft{background:#f1f5f9;color:#64748b}.pill.Active,.pill.Published{background:#d1fae5;color:#047857}.menuwrap{position:relative}.menu{position:absolute;right:0;top:48px;z-index:5;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 15px 35px #0002;min-width:210px;padding:6px}.menu button{display:block;width:100%;border:0;background:white;text-align:left;padding:13px;border-radius:8px}.menu button:hover{background:#ecfeff}.overlay{position:fixed;inset:0;background:#0f172a99;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:white;border-radius:16px;width:min(760px,100%);max-height:95vh;overflow:auto;box-shadow:0 25px 70px #0004}.modalhead,.modalfoot{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modalfoot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:12px}.modalbody{padding:24px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.section{margin-top:26px}.tile{display:block;text-align:left;width:100%;background:white;border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer}.tile.selected{border:2px solid var(--cyan);background:#ecfeff;padding:17px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.builder{display:flex;height:calc(100vh - 79px);min-height:540px}.palette{width:200px;background:white;border-right:1px solid var(--line);padding:20px;flex-shrink:0}.canvas{flex:1;position:relative;min-width:0;background-color:#f8fafc;background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:20px 20px;overflow:hidden}.start{position:absolute;left:50%;top:15%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 24px;border-radius:30px}.connector{position:absolute;left:50%;top:calc(15% + 36px);height:20%;border-left:2px dashed var(--cyan)}.node{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:245px;border:2px solid var(--cyan);border-radius:12px;background:white;box-shadow:0 10px 25px #0002;overflow:hidden;cursor:pointer}.nodehead{background:#ecfeff;color:#155e75;font-weight:700;padding:15px}.nodebody{padding:15px}.settings{width:290px;background:white;border-left:1px solid var(--line);flex-shrink:0;overflow:auto}.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;background:white;padding:16px 4px;color:#64748b}.tabs button.active{border-bottom:2px solid var(--primary);color:var(--primary);font-weight:700}.settingsbody{padding:20px}.info{background:#f0f9ff;border:1px solid #bae6fd;color:#075985;padding:14px;border-radius:12px;line-height:1.6}.toast{position:fixed;bottom:24px;right:24px;background:#064e3b;color:white;padding:15px 22px;border-radius:12px;z-index:20;box-shadow:0 10px 30px #0003}@media(max-width:800px){.sidebar{width:64px;padding:20px 5px}.brand{font-size:15px}.brand small,.nav span{display:none}.content{padding:16px}.palette{width:95px;padding:10px}.settings{width:195px}.fields{grid-template-columns:1fr}.top{padding:12px}.heading{font-size:20px}.table th,.table td{padding:12px 7px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:20px}}@media(max-width:500px){.settings{width:150px}.node{width:160px}.choices{grid-template-columns:1fr}.content{padding:10px}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">HVX<small>Agent Studio</small></div><button class="nav active" id="navAgents" onclick="navigate('list')">◈ <span>Agents</span></button><button class="nav" id="navFlows" onclick="navigate('builder')">◇ <span>Flows</span></button><button class="nav" onclick="notify('Configure the agent in Global Settings')">⚙ <span>Settings</span></button></aside><main class="main" id="main"></main></div><div id="overlayHost"></div><div id="toastHost"></div><script>
let screen='list',menu=false,modal=false,org='',workspace='',choice='scratch',tab='Global Settings',name='Provider Visit Scribe',published=false,search='',llmProvider='',llmModel='';const catalog={'openai':{label:'OpenAI',models:[['gpt-4.1','GPT-4.1'],['gpt-4.1-mini','GPT-4.1 mini']]},'anthropic':{label:'Anthropic',models:[['claude-sonnet-4','Claude Sonnet 4'],['claude-haiku-3.5','Claude Haiku 3.5']]},'google':{label:'Google',models:[['gemini-2.5-pro','Gemini 2.5 Pro'],['gemini-2.5-flash','Gemini 2.5 Flash']]}};const agents=[{channel:'Voice',name:'Skylar - Friendly Guide',status:'Active'},{channel:'Chat',name:'Care Navigator',status:'Draft'},{channel:'Scribe',name:'Provider Visit Scribe',status:'Draft'}];const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(label,fn,kind='')=>`<button class="btn ${kind}" onclick="${fn}">${label}</button>`;const pill=s=>`<span class="pill ${s}">● ${s}</span>`;function notify(s){document.getElementById('toastHost').innerHTML=`<div class="toast">✓ ${E(s)}</div>`;setTimeout(()=>document.getElementById('toastHost').innerHTML='',2800)}function navigate(s){screen=s;modal=false;menu=false;render()}function render(){document.getElementById('main').innerHTML=screen==='list'?list():builder();document.getElementById('overlayHost').innerHTML=modal?modalHTML():'';document.getElementById('navAgents').classList.toggle('active',screen==='list');document.getElementById('navFlows').classList.toggle('active',screen==='builder')}
function list(){let rows=agents.filter(a=>(a.channel+' '+a.name+' '+a.status).toLowerCase().includes(search.toLowerCase()));return `<header class="top"><h2>Agents</h2><div class="actions"><select class="field" style="width:180px"><option>Default Workspace</option><option>Clinical Operations</option><option>Outpatient Care</option></select><input class="field" style="width:165px" placeholder="Search agents" value="${E(search)}" oninput="search=this.value;refreshRows()"><div class="menuwrap">${btn('＋ Create an Agent ▾','menu=!menu;render()','primary')}${menu?`<div class="menu"><button onclick="notify('Voice Agent is outside this prototype');menu=false;render()">☎ Voice Agent</button><button onclick="notify('Chat Agent is outside this prototype');menu=false;render()">▤ Chat Agent</button><button onclick="modal=true;menu=false;render()">▧ Scribe Agent</button></div>`:''}</div></div></header><div class="content"><h1 class="heading">Your agents</h1><div class="muted">Manage and configure AI agents across your workspace.</div><div class="stats"><div class="card stat"><span class="muted">Total Agents</span><strong>${agents.length}</strong></div><div class="card stat"><span class="muted">Active</span><strong>${agents.filter(a=>a.status==='Active').length}</strong></div><div class="card stat"><span class="muted">Drafts</span><strong>${agents.filter(a=>a.status==='Draft').length}</strong></div></div><div class="card" style="overflow:hidden"><table class="table"><thead><tr><th>Channel</th><th>Agent</th><th>Status</th></tr></thead><tbody id="agentRows">${rowsHTML(rows)}</tbody></table></div><p class="muted">Choose Create an Agent → Scribe Agent to begin.</p></div>`}function rowsHTML(rows){return rows.length?rows.map(a=>`<tr><td>${a.channel==='Voice'?'☎':a.channel==='Chat'?'▤':'▧'} ${E(a.channel)}</td><td><button style="border:0;background:transparent;text-align:left;font-weight:600;color:#0e7490" onclick="openAgent('${E(a.name)}')">${E(a.name)}</button></td><td>${pill(a.status)}</td></tr>`).join(''):'<tr><td colspan="3">No matching agents</td></tr>'}function refreshRows(){document.getElementById('agentRows').innerHTML=rowsHTML(agents.filter(a=>(a.channel+' '+a.name+' '+a.status).toLowerCase().includes(search.toLowerCase())))}function openAgent(n){name=n;published=agents.find(a=>a.name===n)?.status==='Published';navigate('builder')}
function modalHTML(){return `<div class="overlay"><div class="modal"><div class="modalhead"><div><h2 style="font:700 21px Sora;margin:0">Create scribe agent</h2><div class="muted" style="margin-top:6px">Configure your browser-based clinical scribe.</div></div>${btn('✕','modal=false;render()','ghost')}</div><div class="modalbody"><div class="fields"><div><label class="label">Organization *</label><select class="field" onchange="org=this.value"><option value="">Select organization</option>${['HealthViewX Demo','Hospital A','Hospital B'].map(x=>`<option ${org===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label">Workspace *</label><select class="field" onchange="workspace=this.value"><option value="">Select workspace</option>${['Default Workspace','Clinical Operations','Outpatient Care'].map(x=>`<option ${workspace===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label">Engine *</label><select class="field" disabled><option>Pipecat</option></select></div></div><div class="section"><label class="label">Type</label><div class="tile selected"><strong>▧ Scribe flow</strong><div class="muted" style="margin-top:8px">Browser listening + live transcript + summary</div></div></div><div class="section"><label class="label">Start from</label><div class="choices"><button class="tile ${choice==='scratch'?'selected':''}" onclick="choice='scratch';render()"><div style="font-size:24px;color:var(--primary)">◇</div><strong>Build from scratch</strong><div class="muted">Start with an editable flow</div></button><button class="tile ${choice==='prompt'?'selected':''}" onclick="choice='prompt';render()"><div style="font-size:24px;color:var(--primary)">✧</div><strong>Generate from prompt</strong> <span class="pill Draft">Suggested</span><div class="muted">AI-assisted setup concept</div></button></div>${choice==='prompt'?'<div style="margin-top:12px"><label class="label">Describe your scribe workflow</label><textarea class="field" rows="3" placeholder="Describe the workflow..."></textarea><small class="muted">Concept only: no AI service is connected.</small></div>':''}</div><p id="error" style="color:var(--danger)"></p></div><div class="modalfoot">${btn('Cancel','modal=false;render()')}${btn('Create agent →','createAgent()','primary')}</div></div></div>`}function selectGlobalModel(value){llmModel=value;llmProvider=Object.entries(catalog).find(([key,item])=>item.models.some(([model])=>model===value))?.[0]||'';render()}function createAgent(){if(!org||!workspace){document.getElementById('error').textContent='Organization and Workspace are required.';return}name='New Scribe Agent';published=false;agents.push({channel:'Scribe',name,status:'Draft'});navigate('builder')}
function builder(){return `<header class="top"><div class="actions">${btn('← Agents','navigate(\'list\')','ghost')}<div><h2>${E(name)}</h2><small class="muted">Scribe / Pipecat · Flow builder</small></div></div><div class="actions">${pill(published?'Published':'Draft')}${btn('Save','saveAgent()')}${btn('Publish','publishAgent()','primary')}</div></header><div class="builder"><aside class="palette"><h3 style="font:600 16px Sora">Nodes</h3><button class="tile" onclick="tab='Node Settings';render()"><span style="color:var(--primary);font-size:22px">▤</span><div style="font-weight:600;margin-top:8px">Post Call Summary</div></button><p class="muted" style="font-size:12px">1 available node</p></aside><div class="canvas"><div class="start">▶ Start</div><div class="connector"></div><div class="node" onclick="tab='Node Settings';render()"><div class="nodehead">▤ Post Call Summary</div><div class="nodebody"><p class="muted">Generate a structured clinical summary after a browser session.</p>${pill('Active')} <small class="muted">Pipecat</small></div></div><span class="pill Draft" style="position:absolute;top:18px;left:18px">Scribe Flow · Browser</span></div><aside class="settings"><div class="tabs"><button class="${tab==='Global Settings'?'active':''}" onclick="tab='Global Settings';render()">Global Settings</button><button class="${tab==='Node Settings'?'active':''}" onclick="tab='Node Settings';render()">Node Settings</button></div><div class="settingsbody">${tab==='Global Settings'?`<h3>Agent configuration</h3><label class="label">Agent name</label><input class="field" id="agentName" value="${E(name)}"><label class="label">Audio source</label><select class="field" disabled><option>Browser microphone</option></select><div class="section"><label class="label" for="stt_provider">STT Provider</label><select class="field" id="stt_provider" aria-label="STT Provider"><option value="azure_stt" selected>Azure STT</option></select><p class="muted" style="font-size:11px;margin-top:8px">Currently, Azure STT is the only available speech-to-text provider.</p></div><div class="section"><label class="label">Model <span style="color:var(--danger)">*</span></label><select class="field" id="global_settings_model_dropdown" onchange="selectGlobalModel(this.value)"><option value="">Select model</option>${Object.entries(catalog).flatMap(([provider,v])=>v.models.map(([model,label])=>`<option value="${E(model)}" ${llmModel===model?'selected':''}>${E(v.label)} · ${E(label)}</option>`)).join('')}</select><p class="muted" style="font-size:11px;margin-top:10px">Uses the existing Global Settings model selector. Provider is automatically derived from the selected model.</p>${llmModel?`<p class="muted" style="font-size:12px">Resolved provider: <strong>${E(catalog[llmProvider]?.label||llmProvider)}</strong></p>`:''}</div><details class="section"><summary style="cursor:pointer;font-weight:600">Submission payload preview</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:10px;border-radius:12px;font-size:11px">${E(JSON.stringify({'response_engine.type':'scribe','llm_config.provider':llmProvider,'llm_config.model':llmModel,'flow_config.nodes':[{id:'start-node-post-call-summary-1',type:'post_call_summary'}]},null,2))}</pre></details><div class="info" style="margin-top:20px">ⓘ Phase 1: Browser-only. Telephony routes disabled.</div>`:`<h3>Post Call Summary</h3><p class="muted">Configure the selected workflow node.</p><label class="label">Node name</label><input class="field" disabled value="Post Call Summary"><p><label class="label">Summary format</label><select class="field"><option>Structured clinical summary</option><option>SOAP Note</option><option>General summary</option></select></p><label class="label">Instructions</label><textarea class="field" rows="6">Summarize the encounter, including chief complaint, findings, assessment and plan.</textarea><p class="muted">Local prototype settings only.</p>`}</div></aside></div>`}function saveAgent(){const el=document.getElementById('agentName');if(el&&el.value.trim()){const old=name;name=el.value.trim();const a=agents.find(a=>a.name===old);if(a)a.name=name}render();notify('Agent saved successfully')}function publishAgent(){if(!llmModel||!llmProvider){tab='Global Settings';render();notify('Select a model in Global Settings before publishing');return}const el=document.getElementById('agentName');if(el&&el.value.trim()){const old=name;name=el.value.trim();const a=agents.find(a=>a.name===old);if(a)a.name=name}published=true;const a=agents.find(a=>a.name===name);if(a)a.status='Published';render();notify('Published')}render();
</script></body></html>
